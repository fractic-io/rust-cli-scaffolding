[package]
name = "fractic-cli-scaffolding"
version = "0.1.0"
authors = ["Mart van Buren <mart@fractic.io>"]
edition = "2021"

[dependencies]
aes-gcm = "^0.11.0"
argon2 = "^0.5.3"
clap = { version = "^4.5.20", features = ["derive"] }
colored = "^3.1.1"
flate2 = "^1.0.35"
fractic-core = { git = "https://github.com/fractic-io/rust-core.git" }
fractic-server-error = { git = "https://github.com/fractic-io/rust-server-error.git" }
fs_extra = "^1.3.0"
inquire = "^0.9.4"
notify-rust = "^4.11.7"
rand = "^0.10.2"
rand_core = "^0.10.1"
regex = "^1.11.2"
serde = { version = "^1.0.214", features = ["derive"] }
serde_json = "^1.0.132"
serde_yaml = "^0.9.34"
sha2 = "^0.11.0"
strum = "^0.28.0"
strum_macros = "^0.28.0"
tar = "^0.4.43"
tempfile = "^3.14.0"
textwrap = "^0.16.1"
tokio = { version = "^1.42.0", features = ["macros", "signal", "io-std", "io-util", "time", "process"] }
uuid = { version = "^1.11.0", features = ["v4"] }

# Feature `aws`.
aws-config = { version = "^1.5.9", optional = true }
aws-sdk-acm = { version = "^1.84.0", optional = true }
aws-sdk-autoscaling = { version = "^1.57.0", optional = true }
aws-sdk-cloudformation = { version = "^1.54.0", optional = true }
aws-sdk-cloudwatchlogs = { version = "^1.87.0", optional = true }
aws-sdk-cognitoidentityprovider = { version = "^1.57.0", optional = true }
aws-sdk-ecr = { version = "^1.52.0", optional = true }
aws-sdk-ecs = { version = "^1.56.0", optional = true }
aws-sdk-iam = { version = "^1.61.0", optional = true }
aws-sdk-route53 = { version = "^1.65.0", optional = true }
aws-sdk-route53domains = { version = "^1.62.0", optional = true }
aws-sdk-s3 = { version = "^1.60.0", optional = true }
aws-sdk-secretsmanager = { version = "^1.52.0", optional = true }
aws-sdk-ses = { version = "^1.51.0", optional = true }
aws-sdk-ssm = { version = "^1.55.0", optional = true }
aws-sdk-sts = { version = "^1.48.0", optional = true }
aws-smithy-runtime-api = { version = "^1.7.3", optional = true }
base64 = { version = "^0.22.1", optional = true }
hex = { version = "^0.4.3", optional = true }

# Feature `docker`.
bollard = { version = "^0.21.0", optional = true }

# Feature `flutter`.
hash = { version = "^0.3.0", optional = true }

# Feature `git`.
git2 = { version = "^0.21.0", optional = true }

# Feature `image`.
magick_rust = { git = "https://github.com/nlfiedler/magick-rust", rev = "dfd8df0dd102348c23b33bfc946a9d70b5db25bf", optional = true }

# Feature `networking`.
hickory-client = { version = "^0.25.2", default-features = false, optional = true }
netstat2 = { version = "^0.11.0", optional = true }
nix = { version = "^0.31.3", features = ["user"], optional = true }
openssh = { version = "^0.11.3", optional = true }
reqwest = { version = "^0.13.4", optional = true }

# Shared by several features.
chrono = { version = "^0.4.42", optional = true }
futures-util = { version = "^0.3.31", optional = true }
walkdir = { version = "^2.5.0", optional = true }

[features]
default = []
aws = [
    "dep:aws-config",
    "dep:aws-sdk-acm",
    "dep:aws-sdk-autoscaling",
    "dep:aws-sdk-cloudformation",
    "dep:aws-sdk-cloudwatchlogs",
    "dep:aws-sdk-cognitoidentityprovider",
    "dep:aws-sdk-ecr",
    "dep:aws-sdk-ecs",
    "dep:aws-sdk-iam",
    "dep:aws-sdk-route53",
    "dep:aws-sdk-route53domains",
    "dep:aws-sdk-s3",
    "dep:aws-sdk-secretsmanager",
    "dep:aws-sdk-ses",
    "dep:aws-sdk-ssm",
    "dep:aws-sdk-sts",
    "dep:aws-smithy-runtime-api",
    "dep:base64",
    "dep:chrono",
    "dep:futures-util",
    "dep:hex",
    "dep:walkdir",
]
docker = ["aws", "dep:bollard", "dep:futures-util", "tokio/full"]
flutter = ["dep:hash"]
git = ["dep:git2", "dep:walkdir"]
image = ["dep:magick_rust"]
networking = [
    "dep:chrono",
    "dep:futures-util",
    "dep:hickory-client",
    "dep:netstat2",
    "dep:nix",
    "dep:openssh",
    "dep:reqwest",
    "dep:walkdir",
    "tokio/net",
    "tokio/fs",
]
